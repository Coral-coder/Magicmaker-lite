name: Release APK

# Publishes an installable APK as a GitHub Release. Push a version tag (v1.0.0) or run the
# workflow manually with a version.
#
# Signing: if the MM_KEYSTORE_* secrets are set, the release build is signed with that key and
# published. Without them there is no key to sign with, so the debug-signed APK is published
# instead — it installs fine, but its signature is not stable across builds, so an update may
# need the previous copy uninstalled first.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and publish, e.g. v1.0.0"
        required: true

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve version
        id: version
        run: |
          tag="${{ github.event.inputs.version || github.ref_name }}"
          name="${tag#v}"
          # 1.2.3 -> 10203, so every published version sorts above the last one.
          code=$(echo "$name" | awk -F. '{printf "%d", ($1*10000)+($2*100)+$3}')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.MM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing key configured — publishing the debug-signed APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        env:
          MM_KEYSTORE_FILE: ${{ steps.signing.outputs.signed == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          MM_KEYSTORE_PASSWORD: ${{ secrets.MM_KEYSTORE_PASSWORD }}
          MM_KEY_ALIAS: ${{ secrets.MM_KEY_ALIAS }}
          MM_KEY_PASSWORD: ${{ secrets.MM_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            task=assembleRelease
            apk=app/build/outputs/apk/release/app-release.apk
          else
            task=assembleDebug
            apk=app/build/outputs/apk/debug/app-debug.apk
          fi
          if ! ./gradlew "$task" \
              -PmmVersionCode=${{ steps.version.outputs.code }} \
              -PmmVersionName=${{ steps.version.outputs.name }} \
              --no-daemon --console=plain 2>&1 | tee build.log; then
            echo "===== compiler errors ====="
            grep -E "^(e|w): " build.log | head -100 || true
            exit 1
          fi
          cp "$apk" "$GITHUB_WORKSPACE/magicmaker-lite-${{ steps.version.outputs.tag }}.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            note="Signed release build."
          else
            note="Debug-signed build (no signing key is configured). It installs from the APK, but the signature is not stable between builds — uninstall the previous copy if an update is refused."
          fi
          {
            echo "MagicMaker Lite $TAG — Android wand transmitter."
            echo
            echo "- Starlight: all 32 palette colors"
            echo "- New Wand: all 288 codes"
            echo "- Transmission period adjustable 200–1000 ms"
            echo
            echo "$note"
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "magicmaker-lite-$TAG.apk" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "magicmaker-lite-$TAG.apk" \
              --title "MagicMaker Lite $TAG" --notes-file notes.md --target "$GITHUB_SHA"
          fi
